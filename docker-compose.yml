version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pmcosmetics-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pmcosmetics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env file}
      POSTGRES_DB: ${POSTGRES_DB:-pmcosmetics}
    # Keep local development ports off public network interfaces.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pmcosmetics-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pmcosmetics-cache
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pmcosmetics-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  pmcosmetics-network:
    driver: bridge
